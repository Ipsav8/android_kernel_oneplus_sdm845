name: Build OnePlus 6 kernel (BakaSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      with_root:
        description: "Add BakaSU + SUSFS (false = plain kernel without root)"
        type: boolean
        default: true
      source_commit:
        description: "Kernel commit to build (78b1551a71ea = your ROM's kernel). Empty = latest on the branch"
        type: string
        default: "78b1551a71ea"
      bakasu_ref:
        description: "BakaSU commit or branch (d5e9e025 = the tested version)"
        type: string
        default: "d5e9e025"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Resolve source commit
        if: ${{ inputs.source_commit != '' }}
        run: |
          URL="https://api.github.com/repos/EdwinMoq/android_kernel_oneplus_sdm845/commits/${{ inputs.source_commit }}"
          SHA=""
          for i in 1 2 3 4 5; do
            SHA=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "$URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])" 2>/dev/null) && [ -n "$SHA" ] && break
            echo "attempt $i failed, retrying in 10s"
            sleep 10
          done
          if [ -z "$SHA" ]; then
            echo "Could not resolve the commit. API answered:"
            curl -s -i -H "Authorization: Bearer ${{ github.token }}" "$URL" | head -15
            exit 1
          fi
          echo "Resolved to $SHA"
          echo "SRC_SHA=$SHA" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_SHA }}
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev cpio zip curl git python3 device-tree-compiler

      - name: Show compiler
        run: |
          clang --version | head -2
          ld.lld --version | head -1

      - name: Add BakaSU and SUSFS patches
        if: ${{ inputs.with_root }}
        run: |
          set -e
          git clone https://github.com/Baka-SU/BakaSU.git BakaSU
          git -C BakaSU checkout ${{ inputs.bakasu_ref }}
          git clone --depth=1 https://github.com/fabiannabil1/susfs-4.19-nongki.git ../susfs-port
          P=$(ls -d ../susfs-port/patches/*/ | head -1)
          ln -sfn ../BakaSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          python3 - << 'PYEOF'
          p = "drivers/Kconfig"
          lines = open(p).read().split("\n")
          if not any("kernelsu" in l for l in lines):
              idx = max(i for i, l in enumerate(lines) if l.startswith("endmenu"))
              lines.insert(idx, 'source "drivers/kernelsu/Kconfig"')
              open(p, "w").write("\n".join(lines))
              print("drivers/Kconfig edited")
          else:
              print("drivers/Kconfig already has kernelsu")
          PYEOF
          echo "KernelSU linked:"; ls drivers/kernelsu/ | head -5
          git apply --reject --whitespace=nowarn "$P/0002-susfs-v2.3.0-4.19.patch" || true
          find . -name '*.rej' | sort

      - name: Hand fixes for the 3 rejected spots
        if: ${{ inputs.with_root }}
        run: |
          set -e
          python3 - << 'PYEOF'
          def edit(path, fn):
              s = open(path).read()
              n = fn(s)
              if n is None:
                  print("ALREADY DONE:", path)
                  return
              open(path, "w").write(n)
              print("EDITED:", path)

          def mk(s):
              if "susfs.o" in s:
                  return None
              k = "ifeq ($(CONFIG_BLOCK),y)"
              assert k in s, "fs/Makefile anchor not found"
              return s.replace(k, "obj-$(CONFIG_KSU_SUSFS) += susfs.o\n\n" + k, 1)

          def cl(s):
              if "susfs_spoof_cmdline_or_bootconfig" in s:
                  return None
              inc = "#include <linux/seq_file.h>\n"
              assert inc in s, "cmdline.c include anchor not found"
              s = s.replace(inc, inc + "#include <linux/jump_label.h>\n", 1)
              a = "static char proc_command_line[COMMAND_LINE_SIZE];\n"
              assert a in s, "cmdline.c buffer anchor not found"
              ext = ("\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                     "extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n"
                     "extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n"
                     "#endif\n")
              s = s.replace(a, a + ext, 1)
              b = "\tseq_puts(m, proc_command_line);\n"
              assert b in s, "cmdline.c show anchor not found"
              hook = ("#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n"
                      "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n"
                      "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n"
                      "\t\treturn 0;\n"
                      "\t}\n"
                      "#endif\n")
              return s.replace(b, hook + b, 1)

          def rb(s):
              if "extern int ksu_handle_sys_reboot" in s:
                  return None
              k = "DEFINE_MUTEX(system_transition_mutex);\n"
              assert k in s, "reboot.c anchor not found"
              ext = ("\n#ifdef CONFIG_KSU_SUSFS\n"
                     "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                     "#endif\n")
              return s.replace(k, k + ext, 1)

          edit("fs/Makefile", mk)
          edit("fs/proc/cmdline.c", cl)
          edit("kernel/reboot.c", rb)
          PYEOF
          find . -name '*.rej' -delete
          find . -name '*.orig' -delete
          test -f fs/susfs.c && echo "fs/susfs.c present"
          ls drivers/kernelsu/ | head -5

      - name: Skip OnePlus 6T (fajita) overlays
        run: |
          python3 - << 'PYEOF'
          import re
          p = "arch/arm64/boot/dts/qcom/Makefile"
          s = open(p).read()
          n, c = re.subn(r"fajita[A-Za-z0-9_.+-]*\.dtbo?", "", s)
          open(p, "w").write(n)
          print("removed fajita entries:", c)
          PYEOF
          grep -n "fajita" arch/arm64/boot/dts/qcom/Makefile || echo "no fajita left in qcom/Makefile"

      - name: Configure
        run: |
          set -eo pipefail
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
          make $ARGS vendor/sdm845-perf_defconfig 2>&1 | tee build.log
          if [ -f arch/arm64/configs/vendor/enchilada.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/enchilada.config 2>&1 | tee -a build.log
          fi
          printf '# CONFIG_FUSE_BPF is not set\nCONFIG_MSM_VIDC_LEGACY_V4L2=y\n' > extra.fragment
          scripts/kconfig/merge_config.sh -m -O out out/.config extra.fragment 2>&1 | tee -a build.log
          if [ "${{ inputs.with_root }}" = "true" ]; then
            echo "--- susfs.fragment:"; cat ../susfs-port/config/susfs.fragment
            scripts/kconfig/merge_config.sh -m -O out out/.config ../susfs-port/config/susfs.fragment 2>&1 | tee -a build.log
          fi
          make $ARGS olddefconfig 2>&1 | tee -a build.log
          grep -E "CONFIG_FUSE_BPF|CONFIG_MSM_VIDC_LEGACY_V4L2" out/.config
          if [ "${{ inputs.with_root }}" = "true" ]; then
            grep -E "^CONFIG_KSU(_SUSFS)?=y" out/.config || { echo "KSU/SUSFS CONFIG DID NOT STICK:"; grep -i ksu out/.config | head -30; exit 1; }
          fi

      - name: Build
        run: |
          set -eo pipefail
          make -j$(nproc) $ARGS 2>&1 | tee -a build.log

      - name: Show real error
        if: failure()
        run: |
          grep -nE "ERROR:|error:|undefined reference|\*\*\* \[" build.log | head -30 || true
          echo "---- single-thread rerun to expose the first error ----"
          make -j1 $ARGS 2>&1 | grep -E -B3 -A6 "ERROR:|error:|\*\*\* \[" | head -60 || true

      - name: Show kernel version
        run: |
          cat out/include/config/kernel.release
          ls -l out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          for f in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f out/arch/arm64/boot/$f ]; then echo "Using $f"; cp out/arch/arm64/boot/$f ak3/; break; fi
          done
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=OP6 BakaSU + SUSFS kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=enchilada
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          if [ "${{ inputs.with_root }}" = "true" ]; then N=OP6-BakaSU-SUSFS-kernel; else N=OP6-baseline-kernel; fi
          echo "ZIPNAME=$N" >> $GITHUB_ENV
          cd ak3 && zip -r9 ../$N.zip . -x '.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-info
          include-hidden-files: true
          path: |
            build.log
            out/.config
          if-no-files-found: ignore
