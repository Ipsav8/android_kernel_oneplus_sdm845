name: Build OnePlus 6 kernel (Lineage source)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Leave empty to auto-detect enchilada defconfig"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev cpio zip curl git python3 device-tree-compiler
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Find defconfig
        run: |
          DEF="${{ inputs.defconfig }}"
          if [ -z "$DEF" ]; then
            DEF=$(cd arch/arm64/configs && find . -name '*enchilada*defconfig' | head -1 | sed 's|^\./||')
          fi
          if [ -z "$DEF" ] || [ ! -f "arch/arm64/configs/$DEF" ]; then
            echo "DEFCONFIG NOT FOUND. Candidates:"
            find arch/arm64/configs \( -iname '*enchilada*' -o -iname '*sdm845*' -o -iname '*oneplus*' \)
            exit 1
          fi
          echo "Using defconfig: $DEF"
          echo "DEFCONFIG=$DEF" >> $GITHUB_ENV

      - name: Build
        run: |
          set -eo pipefail
          export ARCH=arm64
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS=-Wno-error"
          make $ARGS $DEFCONFIG 2>&1 | tee build.log
          make -j$(nproc) $ARGS 2>&1 | tee -a build.log

      - name: Show last errors
        if: failure()
        run: tail -n 60 build.log || true

      - name: Show kernel version
        run: |
          echo "Built kernel release:"
          cat out/include/config/kernel.release
          ls -l out/arch/arm64/boot/

      - name: Save raw kernel output
        uses: actions/upload-artifact@v4
        with:
          name: raw-kernel-output
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md
          for f in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f out/arch/arm64/boot/$f ]; then echo "Using $f"; cp out/arch/arm64/boot/$f ak3/; break; fi
          done
          cat > ak3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=OP6 4.19 Lineage source
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=enchilada
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          cd ak3 && zip -r9 ../OP6-Lineage-kernel.zip . -x '.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: OP6-Lineage-kernel
          path: OP6-Lineage-kernel.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
